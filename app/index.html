<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raftaar</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="widget" data-tauri-drag-region>
      <button id="close" title="Quit Raftaar" aria-label="Quit">×</button>
      <div id="project" data-tauri-drag-region></div>
      <svg id="gauge" viewBox="0 8 200 122" data-tauri-drag-region></svg>
      <div id="meta" data-tauri-drag-region><span id="counts"></span><span id="badge" hidden></span></div>
      <div id="status" data-tauri-drag-region></div>
      <div id="dots"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
